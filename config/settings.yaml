# Public data collector settings. Deal identification, thresholds and alerts live in the private repo.

origin:
  name: Trieste
  lat: 45.6495
  lon: 13.7768

universe:
  radius_km: 800            # straight-line pre-filter only: bounds the map query; drive time below decides
  drive_time:
    enabled: true
    max_hours: 10            # properties further than this by car are left out of the catalog
    endpoint: https://router.project-osrm.org   # public OSRM demo server (FOSSGIS): reasonable non-commercial use, max 1 request/s
    profile: driving
    batch_size: 99           # destinations per request (+1 origin)
    pause_seconds: 1.1
    max_requests_per_run: 400   # leftovers are routed on the next run
    timeout_seconds: 60
    reroute_if_moved_km: 0.5
    keep_unroutable: true    # no road route found (e.g. some islands): keep, with blank drive time
  # Property types pulled into the catalog. A property is the first type whose OSM tags match.
  # Tag value "*" means "key present". stars: allowed star ratings; [] = any rating, including none.
  property_types:
    hotel:
      osm_tags:
        - {tourism: hotel}
      stars: [4, 5]
    bed_and_breakfast:
      osm_tags:
        - {tourism: guest_house}          # OSM's tag for B&Bs and small owner-run guest houses
        - {tourism: bed_and_breakfast}    # non-standard but used
      stars: []                           # B&Bs rarely carry stars; quality comes from guest score (Phase 1d)

overpass:
  endpoints:                # rotated per tile to spread load; the main instance allows ~2 queries/min per address
    - https://overpass-api.de/api/interpreter
    - https://maps.mail.ru/osm/tools/overpass/api/interpreter
    - https://overpass.private.coffee/api/interpreter
  tile_deg: 2.0             # region split into tiles so each query stays small
  tiles_per_run: 12         # once every tile has been refreshed: oldest N per run (76 tiles -> full map renewed ~weekly)
  max_minutes: 20           # stop starting new tiles after this; the rest wait for the next run
  timeout_seconds: 120      # per query; a tile tries each endpoint `retries` times at most
  pause_seconds: [5, 10]    # polite gap between tiles (public, free services)
  retries: 2

paths:
  catalog: data/catalog.csv        # TripAdvisor properties (priceable), refreshed daily; what you select from
  osm_catalog: data/osm_catalog.csv  # OpenStreetMap 4-5* hotels and B&Bs: source of official stars
  ta_state: data/ta_state.json     # TripAdvisor keys found and when each was listed
  heatmap: data/heatmap.csv        # latest cheap/average/high class per night, per watched property
  heatmap_changes: data/heatmap_changes.csv  # nights whose class changed between checks
  booking_ids: data/booking_ids.csv      # Booking.com id per watched property (delta-only mapping)
  landscape: data/landscape.csv          # elevation + distances to sea, beach, lake, ski area, city; tags
  landscape_tiles: data/landscape_tiles.json
  last_minute: data/last_minute_cards.csv  # Booking.com deal badges / advertised discounts for the next nights (raw)
  last_minute_state: data/last_minute_state.json
  booking_calendars: data/booking_calendars.csv  # every night's Booking.com price for 12 months per property (snapshots branch)
  watchlist: data/watchlist.csv    # what the scanner watches = selection rules + include - exclude
  drive_times: data/drive_times.csv  # cache: each property is routed once
  google_ratings: data/google_ratings.csv   # Google rating, reviews, class, amenities per watched property
  places: data/places.csv          # type of place around each watched property (old town, vineyards, ...)
  locations: data/locations.csv    # checked position of each watched hotel (the small store every run reuses)
  location_fixes: config/location_fixes.csv   # positions set by hand: pid,lat,lon,note (always win)
  tile_state: data/tile_state.json   # when each map tile was last refreshed
  selection: config/selection.yaml
  include: config/include.txt
  exclude: config/exclude.txt
  spike: config/spike.yaml
  out_dir: out

tripadvisor:                 # Xotelo (free, keyless TripAdvisor data); keep request counts modest
  base_url: https://data.xotelo.com/api
  user_agent: "hotel-deal-radar/0.5 (personal project)"
  # Country keys used to discover city keys, all confirmed on 2026-11-08 (2,300-3,000 properties inside the radius each):
  # Italy, Slovenia, Croatia, Austria, Germany, Hungary, Czechia, Switzerland, Slovakia, Bosnia, Serbia.
  # A wrong key only yields far-away results, which the radius filter drops.
  # g187070 France (unconfirmed; added after the coverage report showed Nice, Lyon, Cannes... unmatched).
  seed_keys: [g187768, g274862, g294453, g190410, g187275, g274881, g274684, g188045, g274922, g294449, g294471, g187070]
  seed_refresh_days: 30
  page_size: 100
  max_pages_per_seed: 30     # country lists stop at 3,000 anyway
  max_pages_per_city: 10     # big cities (Milan, Rome, Munich, Vienna...) need several pages
  sort: best_value
  types:                     # TripAdvisor accommodation types kept, by kind; anything else is skipped
    hotel: [Hotel, Small Hotel, Boutique Hotel, Resort, Specialty Hotel, Farm Hotel, Inn, Specialty Inn]
    bed_and_breakfast: [Bed and Breakfast, Specialty B&B, Guest house]
  pause_seconds: [1, 2]
  max_requests_per_run: 500
  max_minutes: 25           # daily TripAdvisor listing budget (public repo: free minutes)
  stars_match: {max_km: 0.15, min_name_similarity: 0.55}

scan:
  horizon_days: 365          # check-in dates from today up to this many days ahead
  min_lead_days: 0
  date_windows: []           # optional: only these ranges, e.g. [{from: 2027-01-25, to: 2027-03-31}]
  exclude_windows: []        # optional: never these ranges
  checkin_weekdays: [mon, tue, wed, thu, fri, sat, sun]
  stay_nights: [1]           # e.g. [1, 2, 3] to also catch minimum-stay rates
  adults: 2
  rooms: 1
  currency: EUR
  meal_plans: [breakfast, half_board, full_board, all_inclusive]
  run_budget_minutes: 25     # hard stop per run so the schedule fits the Actions minutes
  properties_per_run: 500    # ~1,500 watched / 500 per run / 2 runs a day -> each checked about every 1.5 days
  max_requests_per_run: 600
  pause_seconds: [0.5, 1.0]  # between Xotelo heatmap calls
  change_log_days: 45        # how long night-level class changes are kept in paths.heatmap_changes
  retry_unpriceable_days: 30 # a property whose price check fails (no partner prices on TripAdvisor) leaves the
                             # watchlist (its quota place goes to the next best) and is re-tried after this

landscape:                   # tags for filtering: mountain, ski, sea, beach, lake, city, countryside
  mountain_min_elevation_m: 800
  ski_km: 5
  sea_km: 2
  beach_km: 1.5
  lake_km: 1
  city_km: 8
  search_km: 10              # distances beyond this are left blank
  elevation_api: https://api.opentopodata.org/v1   # public: max 100 points per call, 1 call/s, 1,000 calls/day
  elevation_dataset: eudem25m
  elevation_calls_per_run: 300
  tiles_per_run: 12
  tile_padding_deg: 0.1      # features just outside a tile still count for properties near its edge
  line_step: 3               # coastline / lake outline: every 3rd point

last_minute:                 # Booking.com's own deal badges ("Late Escape Deal", "Limited-time Deal", "Getaway Deal"...)
  enabled: true
  nights_ahead: [0, 1, 2, 5, 7, 14]   # check-in today + n, 1 night
  towns_per_run: 4           # watchlist towns searched per run (rotating, busiest first)
  scrolls: 2                 # load more result cards per search
  max_minutes: 4

booking_scan:                # Phase 9: Booking.com via headless browser (calendar = every night's price for 24 months)
  map_per_run: 300           # one-by-one id searches per run, after the town searches
  map_share: 0.3             # share of the time budget for mapping...
  map_share_backlog: 0.75    # ...or this much while more than map_backlog watched properties have no id yet
  map_backlog: 100
  town_min_properties: 2     # towns with at least this many unmapped watched properties get town searches
  town_scrolls: 4
  town_filters: ["class%3D4%3Bclass%3D5", "review_score%3D90"]   # 4-5 stars; guest score 9+ (any class)
  warm_up_page: it/grand-duchi-d-aosta   # a known hotel page opened first: passes the challenge, sets the session token
  match_min_similarity: 0.6
  remap_after_days: 30       # retry 'not found' after this
  properties_per_run: 2000   # per job; coverage drives finds like Haus Hepi (#28); public repo minutes are free
  windows: 12                # 61-night calendar calls per property for the whole horizon (12 = 24 months, ~1.3 s each)
  near_windows: 6            # refreshed on every pass (12 months)...
  far_every_hours: 24        # ...the rest (months 13-24, which few hotels sell yet) once a day
  every_hours: 4             # a full pass is due when the newest calendar is this old (owner, 2026-11-23)
  shards: 4                  # parallel calendar jobs; must match the matrix in .github/workflows/booking.yml
  stop_after_failures: 12    # this many calendars failing in a row: Booking.com is probably blocking; the job stops
  max_minutes: 55            # per job (the map job: mapping gets the first 30%, last-minute searches the rest)



ops:                         # Phase 8: daily health check (workflow file -> max hours since its last successful run)
  max_hours_since_success:
    scan.yml: 14
    booking.yml: 8
    catalog.yml: 30
    osm.yml: 200
    places.yml: 30

catalog_changes:             # optional public issue listing new / gone properties after each catalog refresh
  issue: false
  max_listed: 150

google_ratings:              # Google rating, number of reviews, class and amenities per watched property (Google Hotels)
  refresh_days: 30           # each property re-checked after this
  retry_days: 7              # a property not found is tried again after this
  max_per_run: 250
  max_minutes: 20
  min_similarity: 0.72       # name match between the watched property and the Google card
  min_similarity_others: 0.85   # other watched properties filled from the same results need a closer match
  wait_ms: 2500
  pause_seconds: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

places:                      # type of place around each watched property (filters: mountain spa, old town, ...)
  mountain_min_elevation_m: 800
  ski_km: 5
  sea_km: 2
  beach_km: 1.5
  lake_km: 1
  city_km: 8
  major_city_km: 15
  major_city_population: 250000
  vineyard_km: 1.5
  old_town_radius_m: 700     # historic sites with a Wikidata entry counted within this distance...
  old_town_min: 8            # ...at least this many make an old town
  unesco_km: 1.0             # or the centre of a UNESCO World Heritage site this close
  thermal_km: 3
  coast_km: 3                # land or water side of the nearest coastline within this (owner, 2026-11-23: no hotels in the sea)
  extracts_index: https://download.geofabrik.de/index-v1.json   # OpenStreetMap extracts (Geofabrik), smallest per property
  skip_extracts: []          # extract ids never to download
  pad_km: 16                 # features this far beyond the properties of an extract still count
  refresh_days: 120
  max_minutes: 45
  elevation_points_per_run: 1000

locations:                   # where each watched hotel really is (owner, 2026-11-23: no hotels in the sea; reuse known ones)
  name_match_km: 3           # an OpenStreetMap hotel with the same name this close to the listed position
  min_similarity: 0.85
  photon_url: https://photon.komoot.io/api/   # OpenStreetMap search; only for hotels the OSM catalog lacks
  photon_keys: [tourism, building, amenity]
  photon_max_km: 30          # a same-name result further than this from the listed position is another place
  photon_per_run: 400
  pause_seconds: 1.1         # Photon: keep it gentle
  stop_after_errors: 5
  agree_km: 0.5              # the listing agrees with a better source within this
  water_margin_m: 60         # on the water side of the coastline by more than this = in the sea (listed in the summary)
  refresh_days: 180
  retry_days: 30             # hotels with only the listed position are searched again after this
  max_minutes: 12
  user_agent: "hotel-price-scraper/1.0 (personal project; github.com/ChambaPie/hotel-price-scraper)"

seller_probe:                # probe S0 (owner, 2026-11-23: prices only from the sellers' own websites)
  hotels: 6                  # watched hotels per seller (one per country first)
  checkin_offset_days: 21
  sellers:                   # search page per seller; {q} hotel name + town, {checkin} YYYY-MM-DD, {checkin_slash} YYYY/MM/DD
    hotels_com: "https://www.hotels.com/Hotel-Search?destination={q}&startDate={checkin}&endDate={checkout}&adults={adults}&rooms=1"
    expedia: "https://www.expedia.it/Hotel-Search?destination={q}&startDate={checkin}&endDate={checkout}&adults={adults}&rooms=1"
    agoda:                   # the search address alone opens the home page (2026-11-23): use the search box
      home: "https://www.agoda.com/en-gb/"
      input: "[data-selenium='textInput'], input[placeholder*='destination' i], input[placeholder*='Where' i]"
      suggestion: "[data-selenium='autosuggest-item'], [role='option'], li[data-element-name*='suggest']"
      search: "[data-selenium='searchButton'], button:has-text('SEARCH'), button:has-text('Search')"
    trip_com:
      home: "https://www.trip.com/hotels/?curr=EUR&locale=en-GB"
      input: "input#hotels-destination, input[placeholder*='City' i], input[placeholder*='destination' i], input[placeholder*='Where' i]"
      suggestion: "[role='option'], [class*='associative'] li, [class*='suggest'] li"
      search: "button:has-text('Search'), [class*='search-btn']"
  block_phrases: ["Bot or Not", "Show us your human side", "Access Denied", "captcha", "are you a robot", "unusual traffic",
                  "Pardon Our Interruption", "verify you are human", "Request unsuccessful", "Just a moment",
                  "Attention Required", "Please enable JS and disable any ad blocker", "Sei un robot"]
  json_url_pattern: "graphql|/api/|search|availability|rates|price"
  json_per_page: 10
  wait_ms: 8000
  pause_seconds: 3
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
  accept_language: "en-GB,en;q=0.9"
  site_workers: 8            # official sites fetched in parallel (each site gets 1-3 requests)
  site_timeout: 20
  follow_links: 2            # booking links opened when the home page names no engine
  booking_words: ["book", "buchen", "prenot", "reserv", "anfrage", "availab", "disponibil", "verfügbar", "rezerv", "foglal"]
  not_engines: ["booking.com", "expedia", "hotels.com", "agoda", "trip.com", "tripadvisor", "trivago", "holidaycheck",
                "facebook", "instagram", "google", "youtube", "linkedin", "twitter", "pinterest", "airbnb",
                "opentable", "sevenrooms", "aleno", "tably", "volvocars"]   # restaurant tables, not rooms
  engines:                   # booking engine -> patterns in the page (links, scripts); the first match wins
    simplebooking: ["simplebooking\\.(?:it|travel)"]
    vertical_booking: ["vertical-?booking"]
    siteminder: ["thebookingbutton\\.com", "direct-book\\.com", "siteminder"]
    seekda: ["seekda"]
    easybooking: ["easybooking\\.(?:at|eu)", "easy-booking\\.at"]
    bookassist: ["bookassist"]
    synxis: ["synxis\\.com", "travelclick"]
    d_edge: ["availpro\\.com", "secure-hotel-booking\\.com", "d-edge"]
    reservit: ["reservit\\.com"]
    hotel_spider: ["hotel-spider"]
    ericsoft: ["ericsoft"]
    blastness: ["blastness"]
    bedzzle: ["bedzzle"]
    passepartout: ["passepartout\\.(?:net|cloud)", "5stelle"]
    octorate: ["octorate"]
    krossbooking: ["krossbooking"]
    slope: ["slope\\.it"]
    quovai: ["quovai"]
    wubook: ["wubook"]
    cloudbeds: ["cloudbeds\\.com"]
    mews: ["mews\\.(?:li|com)/distributor", "app\\.mews\\.com"]
    beds24: ["beds24\\.com"]
    smoobu: ["smoobu"]
    lodgify: ["lodgify"]
    profitroom: ["profitroom"]
    guestcentric: ["guestcentric"]
    mirai: ["mirai\\.com"]
    roiback: ["roiback"]
    dirs21: ["dirs21"]
    hotelnetsolutions: ["hotelnetsolutions"]
    casablanca: ["casablanca\\.at"]
    gastrodat: ["gastrodat"]
    feratel: ["feratel", "deskline"]
    hotelrunner: ["hotelrunner"]
    omnibees: ["omnibees"]
    little_hotelier: ["littlehotelier"]
    apaleo: ["apaleo"]
    net_affinity: ["netaffinity"]
    bookingexpert: ["bookingexpert\\.it"]     # survey 2026-11-23: the most common unrecognised booking site (10)
    iperbooking: ["iperbooking"]
    scidoo: ["scidoo\\.com"]
    capcorn: ["capcorn\\.net"]
    zimres: ["zimres\\.com"]
    reconline: ["reconline\\.com"]

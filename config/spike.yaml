# Phase 2 source spike: which price sources answer, from where, and with what data.
# Guests and currency come from settings.yaml (scan.adults, scan.rooms, scan.currency).
label: ""                    # report label; empty = "github-actions" on Actions, "local" elsewhere
pause_seconds: [1, 3]        # between requests
raw_max_bytes: 300000        # raw responses kept per request (for writing parsers later)

xotelo:                      # free, keyless TripAdvisor-based rates API (data.xotelo.com)
  base_url: https://data.xotelo.com/api
  user_agent: "hotel-deal-radar/0.4 (personal project)"
  # TripAdvisor location keys for /list. g187813 = Trieste, g187791 = Rome (cities, confirmed). The others test
  # whether region/country-level keys work: g187768 (Italy), g274862, g294453, g190410 (expected Slovenia, Croatia, Austria).
  location_keys: [g187813, g187791, g187768, g274862, g294453, g190410]
  hotels_from_list: 5        # first N hotels of each list get the /rates and /heatmap probes
  rates_offsets_days: [7, 30, 90, 180, 300]          # check-in = today + offset, 1 night
  heatmap_checkout_offsets_days: [30, 90, 180, 330]  # how far ahead the heatmap reaches
  heatmap_hotels: 2
  search:
    - {query: Trieste, location_type: geo}
    - {query: "Grand Hotel Duchi d'Aosta", location_type: accommodation}

booking:
  base_url: https://www.booking.com
  pages:                     # Booking.com property pages: /hotel/<country>/<pagename>.html
    - {country: it, pagename: grand-duchi-d-aosta}
  checkin_offset_days: 30
  calendar_days: 61
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
  accept_language: "en-GB,en;q=0.9"

catalog_match:               # how many Xotelo list hotels can be matched to data/catalog.csv automatically
  max_km: 0.25
  min_name_similarity: 0.6

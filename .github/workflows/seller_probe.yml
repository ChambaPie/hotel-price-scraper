name: Seller probe
# Schedules run as the account that last committed this file; keep it a real GitHub account.

# Probe S0 (owner, 2026-11-23: prices only from the sellers' own websites): can an automated browser on GitHub's
# servers read prices on Expedia, Hotels.com, Agoda and Trip.com, and which booking engines do the watched hotels'
# official websites use. Manual only; results on the reports branch (reports/sellers/latest/).
on:
  schedule:
    - cron: "23 4 * * *"   # daily: the booking-engine survey (part engines), as Google gives more official websites
  workflow_dispatch:
    inputs:
      part:
        description: "sellers, engines, engine_pages or all"
        default: "all"
      hotels:
        description: "Hotels per seller"
        default: "6"
      sellers:
        description: "Sellers (comma-separated keys from settings seller_probe.sellers; empty = all)"
        default: ""
      catalog:
        description: "Also every catalogued seller with these statuses (settings sellers), e.g. probe,account,official"
        default: ""
      person:
        description: "Every seller in Google Chrome with a window (like a person's browser)"
        type: boolean
        default: false
      runner:
        description: "Machine: ubuntu-24.04, macos-latest or windows-latest (Expedia and Priceline refuse the Linux ones)"
        default: "ubuntu-24.04"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}   # pinned: ubuntu-latest is migrating to 26.04 (Playwright deps)
    timeout-minutes: 75
    defaults:
      run:
        shell: bash          # also on Windows (Git Bash)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-browser.txt
      - run: bash scripts/install_browser.sh
      - name: Probe
        env:
          PART: ${{ inputs.part || 'engines' }}
          HOTELS: ${{ inputs.hotels || '6' }}
          SELLERS: ${{ inputs.sellers }}
          CATALOG: ${{ inputs.catalog }}
          PERSON: ${{ inputs.person }}
        run: |
          set -o pipefail
          mkdir -p out/sellers
          [ "$PART" = "suggest" ] && exit 0
          source scripts/screen.sh   # wrap: a virtual screen on Linux; macOS and Windows runners have a real one
          wrap python -m hotel_scraper.seller_probe --part "$PART" --hotels "$HOTELS" --sellers "$SELLERS" --catalog "$CATALOG" $([ "$PERSON" = true ] && echo --person) --out out/sellers 2>&1 | tee out/sellers/probe.log
          cat out/sellers/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Suggestions while typing (part suggest; sellers input = seller:query;query, or seller:url|url)
        if: inputs.part == 'suggest'
        env:
          SPEC: ${{ inputs.sellers }}
          PERSON: ${{ inputs.person }}
        run: |
          mkdir -p out/sellers
          # queries are split on ';', or on '|' when there is one (page addresses may hold ';', e.g. eDreams')
          rest="${SPEC#*:}"; sep=';'; [[ "$rest" == *"|"* ]] && sep='|'
          seller="${SPEC%%:*}"; IFS="$sep" read -ra Q <<< "$rest"
          args=(); for q in "${Q[@]}"; do args+=(--query "$q"); done
          source scripts/screen.sh
          wrap python -m hotel_scraper.suggest_probe --seller "$seller" "${args[@]}" --follow \
            $([ "$PERSON" = true ] && echo --person) --out out/sellers/suggest 2>&1 | tee out/sellers/suggest.log
      - name: Commit the official sites list (engines survey)
        if: (inputs.part || 'engines') == 'engines' || inputs.part == 'all'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official_sites.csv
          git diff --cached --quiet || git commit -m "Official sites and booking engines $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep $((i * 5)); done
      - name: Publish reports
        if: always()
        env:
          NAME: sellers-${{ inputs.part || 'engines' }}-${{ inputs.runner != 'ubuntu-24.04' && inputs.runner || '' }}${{ inputs.sellers }}-${{ inputs.catalog }}
        run: bash scripts/publish_reports.sh "$(echo "$NAME" | tr -c 'A-Za-z0-9_\n-' '_' | sed 's/_*$//')"   # one folder per probe: runs can overlap

name: Refresh official stars and landscape (weekly)
# Schedules run as the account that last committed this file; keep it a real GitHub account.

# OpenStreetMap 4-5* hotels and B&Bs -> data/osm_catalog.csv, used only to add official star ratings to the
# TripAdvisor catalog. Rolling map tiles: settings overpass.tiles_per_run / max_minutes.
on:
  schedule:
    - cron: "11 2 * * 1"   # Mondays 02:11 UTC
  workflow_dispatch:
    inputs:
      max_tiles:
        description: "Limit this run to N tiles (empty = normal rotation)"
        required: false
        default: ""
      max_minutes:
        description: "Map time budget in minutes (empty = settings)"
        required: false
        default: ""
      landscape_minutes:
        description: "Landscape tagging time budget in minutes"
        required: false
        default: "15"

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-catalog.txt
      - name: Refresh OpenStreetMap catalog
        env:
          MAX_TILES: ${{ inputs.max_tiles }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          set -o pipefail
          mkdir -p out
          python -m hotel_scraper.refresh ${MAX_TILES:+--max-tiles "$MAX_TILES"} ${MAX_MINUTES:+--max-minutes "$MAX_MINUTES"} 2>&1 | tee out/osm.log
      - name: Landscape tags (elevation, sea, beach, lake, ski area, city)
        env:
          LMIN: ${{ inputs.landscape_minutes || '15' }}
        run: |
          set -o pipefail
          python -m hotel_scraper.landscape --max-minutes "$LMIN" 2>&1 | tee out/landscape.log
      - name: Summary
        if: always()
        run: cat out/osm_summary.md out/landscape_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_catalog.csv data/drive_times.csv data/tile_state.json data/landscape.csv data/landscape_tiles.json
          git diff --cached --quiet || git commit -m "OpenStreetMap stars refresh $(date -u +%F)"
          git pull --rebase
          git push
      - name: Publish reports
        if: always()
        run: bash scripts/publish_reports.sh osm
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Run failed: ${{ github.workflow }}"
          body="Run ${{ github.run_id }} failed on $(date -u +%F\ %H:%MZ): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (log also on the reports branch)."
          n=$(gh issue list --label ops --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label ops --body "$body"; fi

name: Edit selection

# Include or exclude properties by id (ids are in data/catalog.csv and in the catalog-change issues).
# Works from the GitHub mobile app: Actions -> Edit selection -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      include:
        description: "Always watch these ids (comma or space separated), e.g. osm:way/123, osm:node/456"
        required: false
        default: ""
      exclude:
        description: "Never watch these ids"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # logs reach the file as they happen

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update include/exclude lists and watchlist
        env:
          INCLUDE: ${{ inputs.include }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -o pipefail
          mkdir -p out
          python -m hotel_scraper.selection --include "$INCLUDE" --exclude "$EXCLUDE" 2>&1 | tee out/selection.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/include.txt config/exclude.txt data/watchlist.csv
          git diff --cached --quiet || git commit -m "Selection edit $(date -u +%F)"
          git pull --rebase
          git push
      - name: Publish reports
        if: always()
        run: bash scripts/publish_reports.sh selection

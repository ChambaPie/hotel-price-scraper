name: Vendors per hotel
# Schedules run as the account that last committed this file; keep it a real GitHub account.

# Who sells each watched hotel, from Google Hotels' list of sellers (names only, never Google's prices), plus the
# official website's address: data/hotel_vendors.csv, rolling (settings google_vendors). The vendor counts decide which
# vendor readers come next (owner, 2026-11-23: every vendor that sells the room itself).
on:
  schedule:
    - cron: "47 5,11,17,23 * * *"   # 4 a day until every hotel has been looked up (public repo: free minutes)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes (empty = settings)"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: vendors
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  vendors:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is migrating to 26.04 (Playwright browser deps)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-browser.txt
      - run: bash scripts/install_browser.sh
      - name: Vendors per hotel (Google Hotels)
        env:
          MIN: ${{ inputs.minutes }}
        run: |
          set -o pipefail
          mkdir -p out
          python -m hotel_scraper.google_vendors ${MIN:+--max-minutes "$MIN"} 2>&1 | tee out/google_vendors.log
          cat out/google_vendors_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotel_vendors.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vendors per hotel $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep $((i * 5)); done
      - name: Publish reports
        if: always()
        run: bash scripts/publish_reports.sh vendors
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Run failed: ${{ github.workflow }}"
          body="Run ${{ github.run_id }} failed on $(date -u +%F\ %H:%MZ): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (log also on the reports branch)."
          n=$(gh issue list --label ops --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label ops --body "$body"; fi

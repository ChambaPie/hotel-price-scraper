name: Place details (daily)
# Schedules run as the account that last committed this file; keep it a real GitHub account.

# For every watched property: the type of place around it (OpenStreetMap: old town, vineyards, thermal baths, major
# city, mountain, sea, lake, ...) and its Google rating, number of reviews and amenities (Google Hotels).
# Rolling, time-boxed: settings places.* and google_ratings.*.
on:
  schedule:
    - cron: "29 10 * * *"   # daily 10:29 UTC
  workflow_dispatch:
    inputs:
      places_minutes:
        description: "Type-of-place time budget in minutes (empty = settings)"
        required: false
        default: ""
      google_minutes:
        description: "Google ratings time budget in minutes (empty = settings)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: places
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  places:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is migrating to 26.04 (Playwright browser deps)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-places.txt
      - name: Type of place (OpenStreetMap)
        env:
          MIN: ${{ inputs.places_minutes }}
        run: |
          set -o pipefail
          mkdir -p out
          python -m hotel_scraper.places ${MIN:+--max-minutes "$MIN"} 2>&1 | tee out/places.log
      - run: bash scripts/install_browser.sh
      - name: Google rating, reviews and amenities (Google Hotels)
        env:
          MIN: ${{ inputs.google_minutes }}
        run: |
          set -o pipefail
          python -m hotel_scraper.google_ratings ${MIN:+--max-minutes "$MIN"} 2>&1 | tee out/google_ratings.log
      - name: Summary
        if: always()
        run: cat out/places_summary.md out/google_ratings_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit
        if: always()   # keep what the first step found even if the Google step fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.csv data/google_ratings.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Place details $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep $((i * 5)); done
      - name: Publish reports
        if: always()
        run: bash scripts/publish_reports.sh places
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Run failed: ${{ github.workflow }}"
          body="Run ${{ github.run_id }} failed on $(date -u +%F\ %H:%MZ): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (log also on the reports branch)."
          n=$(gh issue list --label ops --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label ops --body "$body"; fi

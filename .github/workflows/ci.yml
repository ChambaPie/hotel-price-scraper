name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit and regression tests (with coverage)
        run: |
          set -o pipefail
          python -m pytest -q --cov=hotel_scraper --cov-report=term-missing:skip-covered | tee pytest.txt
          { echo '## Tests'; echo '```'; tail -40 pytest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

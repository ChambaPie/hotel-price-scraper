name: Health check (daily)
# Schedules run as the account that last committed this file; keep it a real GitHub account.

# Opens (or comments on) an "ops" issue when a workflow's last successful run is too old (settings: ops).
on:
  schedule:
    - cron: "47 7 * * *"   # 07:47 UTC, after the morning scan
  workflow_run:            # scheduled runs can be dropped; also check after the main jobs
    workflows: ["Booking.com collection", "Scan for deals"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is migrating to 26.04 (Playwright browser deps)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python -m hotel_scraper.health | tee out/health.log
          cat out/health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Issue if something is wrong
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Health check: scheduled runs are late or failing"
          n=$(gh issue list --label ops --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ ! -s out/health_issue.md ]; then          # all good: close a still-open health issue
            [ -n "$n" ] && gh issue close "$n" --comment "All scheduled workflows are on time again."
            exit 0
          fi
          if [ -z "$n" ]; then gh issue create --title "$title" --label ops --body-file out/health_issue.md; exit 0; fi
          last=$(gh issue view "$n" --json comments,body --jq '(.comments[-1].body // .body)')
          [ "$last" = "$(cat out/health_issue.md)" ] && { echo "same problems as last time; not commenting again"; exit 0; }
          gh issue comment "$n" --body-file out/health_issue.md
      - name: Publish reports
        if: always()
        run: bash scripts/publish_reports.sh health

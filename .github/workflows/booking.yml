name: Booking.com collection
# Schedules run as the account that last committed this file; keep it a real GitHub account.

# Maps watched properties to Booking.com ids, collects every night's price for 12 months (published to the
# `snapshots` branch) and the deal badges for the next nights. Deal identification runs in the private repo.
on:
  schedule:
    - cron: "47 11,23 * * *"   # 11:47 and 23:47 UTC (between the TripAdvisor scans)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget (empty = settings)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write   # failure reports

concurrency:
  group: booking
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  booking:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is migrating to 26.04 (Playwright browser deps)
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-browser.txt
      - run: bash scripts/install_browser.sh
      - name: Previous calendars (snapshots branch)
        run: git fetch -q origin snapshots && git show origin/snapshots:booking_calendars.csv > data/booking_calendars.csv || echo "no snapshot yet"
      - name: Collect
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -o pipefail
          mkdir -p out
          python -m hotel_scraper.booking_collect ${MINUTES:+--minutes "$MINUTES"} 2>&1 | tee out/booking_collect.log
      - name: Summary
        if: always()
        run: cat out/booking_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/booking_ids.csv data/last_minute_cards.csv data/last_minute_state.json
          git diff --cached --quiet || git commit -m "Booking.com scan $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep $((i * 5)); done
      - name: Publish calendars snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_snapshot.sh snapshots data/booking_calendars.csv
      - name: Publish reports
        if: always()
        run: bash scripts/publish_reports.sh booking-scan
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Run failed: ${{ github.workflow }}"
          body="Run ${{ github.run_id }} failed on $(date -u +%F\ %H:%MZ): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (log also on the reports branch)."
          n=$(gh issue list --label ops --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label ops --body "$body"; fi
